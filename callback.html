<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clips Ranking Uploader - Connecting</title><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222;text-align:center}a{color:#0a58ca}</style></head><body>
<h1 id="h">Connecting your TikTok account...</h1><p id="p">Returning to Clips Ranking Uploader.</p>
<script>
var q=new URLSearchParams(location.search),st=q.get('state')||'',m=/^cru(\d{2,5})_/.exec(st);
if(q.get('error')){document.getElementById('h').textContent='Authorization was not completed';document.getElementById('p').textContent=q.get('error_description')||q.get('error');}
if(m){setTimeout(function(){location.replace('http://localhost:'+m[1]+'/callback'+location.search);},1200);}
else if(q.get('code')){document.getElementById('h').textContent='Authorization complete';document.getElementById('p').textContent='Code: '+q.get('code');}
</script></body></html>
